name: Build TrollStore TIPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-tipa.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild \
            -project FatLoss28.xcodeproj \
            -scheme FatLoss28 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package TIPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FatLoss28.app Payload/
          zip -r "28天减脂打卡.tipa" Payload

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: 28天减脂打卡-tipa
          path: 28天减脂打卡.tipa
