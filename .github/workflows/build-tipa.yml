name: Build TrollStore TIPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-tipa.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild \
            -project FatLoss28.xcodeproj \
            -scheme FatLoss28 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package TIPA
        run: |
          set -e

          echo "查找编译生成的 APP..."
          find build/Build/Products -type d -name "*.app" -print

          APP_PATH=$(find build/Build/Products -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "错误：没有找到 .app 文件"
            exit 1
          fi

          echo "找到 APP：$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r "28天减脂打卡.tipa" Payload
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: FatLoss28-TIPA
          path: 28天减脂打卡.tipa
          if-no-files-found: error
