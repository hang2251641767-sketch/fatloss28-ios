name: Build FitLife V4 TIPA
on:
  push:
    branches: [main]
    paths:
      - 'FitLife/**'
      - 'project.yml'
      - '.github/workflows/build-tipa.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitlife-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate sources and resources
        run: python3 scripts/check_project.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iOS 16+ app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project FitLife.xcodeproj -scheme FitLife \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 build | tee build.log
      - name: Ad-hoc sign and package for TrollStore
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/FitLife.app"
          test -f "$APP/FitLife"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f -name '*.dylib' -exec codesign --force --sign - {} \;
            find "$APP/Frameworks" -type d -name '*.framework' -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements FitLife/FitLife.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry FitLife-V4.0.tipa Payload)
          python3 scripts/check_tipa.py dist/FitLife-V4.0.tipa
          shasum -a 256 dist/FitLife-V4.0.tipa > dist/SHA256SUMS.txt
      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-V4.0-TIPA
          path: |
            dist/FitLife-V4.0.tipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct TIPA download to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v4.0.0-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/FitLife-V4.0.tipa dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "FitLife V4.0 · Build ${GITHUB_RUN_NUMBER}" \
            --notes "简体中文版；iOS 16.0+。本包用于已安装 TrollStore 的兼容设备测试。编译与包结构校验通过；真机运行、通知和旧版覆盖安装仍需验证。安装前建议先备份旧数据。" \
            --latest
      - name: Upload build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-build-log
          path: build.log
          if-no-files-found: ignore
