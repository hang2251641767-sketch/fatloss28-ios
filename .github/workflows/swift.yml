name: Swift preflight
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_project.py
      - name: Parse Swift sources
        run: xcrun swiftc -frontend -parse $(find FitLife -name '*.swift')
