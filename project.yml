name: FitLife
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.fatloss28
    MARKETING_VERSION: "4.1.0"
    CURRENT_PROJECT_VERSION: "410"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FitLife:
    type: application
    platform: iOS
    sources:
      - path: FitLife
        excludes: [Info.plist, FitLife.entitlements]
    settings:
      base:
        INFOPLIST_FILE: FitLife/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FitLife/FitLife.entitlements
  FitLifeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FitLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fatloss28.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitLife.app/FitLife"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FitLife:
    build:
      targets:
        FitLife: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [FitLifeTests]
